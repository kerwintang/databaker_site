<!DOCTYPE html>
<html>
  <head>
    <title>Data Baker</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Raleway"
    />
    <style>
      body,
      h1,
      h2,
      h3,
      h4,
      h5 {
        font-family: "Raleway", sans-serif;
      }
    </style>
  </head>
  <body class="w3-light-grey">
    <!-- w3-content defines a container for fixed size centered content, 
and is wrapped around the whole page content, except for the footer in this example -->
    <div class="w3-content" style="max-width: 1400px">
      <!-- Header -->
      <header class="w3-container w3-center w3-padding-32">
        <h1><b>Data Baker</b></h1>
        <p>We have a large collection of data sets that you can use</p>
      </header>

      <!-- Grid -->
      <div>
        <!-- Blog entries -->
        <div>
          <form id="signup-form">
            <input
              id="name"
              type="text"
              name="name"
              placeholder="Your Name"
              required
            />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your Email"
              required
            />
            <button type="submit">Sign Up</button>
          </form>

          <script>
            const form = document.getElementById("signup-form");
            form.addEventListener("submit", (e) => {
              e.preventDefault();
              fetch(
                "https://script.google.com/macros/s/AKfycbxnjeGH5fIqAUU3ynNMaEIy4s72TbHAHnZ6bVWHZvtPgwqdHDIxeWBX8VwWiIbo8tQ/exec",
                {
                  method: "POST",
                  mode: "cors",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    name: document.querySelector("#name").value,
                    email: document.querySelector("#email").value,
                  }),
                }
              )
                .then((res) => res.json())
                .then((data) => {
                  console.log(data);
                  alert("Thanks for signing up!");
                })
                .catch((err) => {
                  console.error("Error:", err);
                  alert("Something went wrong. Please try again.");
                });
            });
          </script>
        </div>

        <!-- END GRID -->
      </div>
      <br />

      <!-- END w3-content -->
    </div>

    <!-- Footer -->
    <footer
      class="w3-container w3-dark-grey w3-padding-32 w3-margin-top"
    ></footer>
  </body>
</html>
